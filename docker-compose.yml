services:
  cortex-rag:
    build:
      context: .
      dockerfile: Dockerfile
    image: cortex-enterprise-rag:latest
    container_name: cortex-rag-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Optional: set DATABASE_URL if connecting to external PostgreSQL with pgvector
      # - DATABASE_URL=postgresql://user:pass@host:5432/rag_db
      # Optional: set OPENAI_API_KEY / GOOGLE_GENERATIVE_AI_API_KEY for live models
      # - OPENAI_API_KEY=your_key_here
      # - GOOGLE_GENERATIVE_AI_API_KEY=your_key_here
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
