image: node:22-alpine

stages:
  - test
  - build

variables:
  PNPM_HOME: "/pnpm"
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: rag_test
  TEST_DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/rag_test"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .pnpm-store
    - node_modules/
    - .next/cache/

before_script:
  - corepack enable
  - corepack prepare pnpm@12.10.1 --activate
  - pnpm config set store-dir .pnpm-store

test:
  stage: test
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
  script:
    - pnpm install --frozen-lockfile
    - pnpm prisma generate
    - pnpm lint
    - pnpm typecheck
    - DATABASE_URL="$TEST_DATABASE_URL" pnpm prisma migrate deploy
    - pnpm test
    - node scripts/verify-responsiveness.mjs
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build:
  stage: build
  script:
    - pnpm install --frozen-lockfile
    - pnpm run build
  artifacts:
    paths:
      - .next/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
